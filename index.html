<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Random Password Generator | Veda Technology</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <p class="brand">VEDA TECHNOLOGY</p>
      <h1>🔐 Password Generator</h1>
      <p class="subtitle">Create a strong password in seconds</p>
    </header>

    <section class="card" aria-label="Password generator">
      <label for="password">Generated Password</label>

      <div class="password-box">
        <input id="password" type="text"
               placeholder="Your password appears here"
               readonly aria-label="Generated password">
        <button id="copyBtn" class="copy-btn" type="button">
          Copy
        </button>
      </div>
      <p id="copyMessage" class="message" aria-live="polite"></p>

      <div class="length-heading">
        <label for="length">Password Length</label>
        <output id="lengthValue" for="length">16</output>
      </div>

      <input id="length" type="range" min="8" max="64" value="16">

      <div class="options">
        <label class="option">
          <input type="checkbox" id="uppercase" checked>
          <span>Uppercase (A-Z)</span>
        </label>

        <label class="option">
          <input type="checkbox" id="lowercase" checked>
          <span>Lowercase (a-z)</span>
        </label>

        <label class="option">
          <input type="checkbox" id="numbers" checked>
          <span>Numbers (0-9)</span>
        </label>

        <label class="option">
          <input type="checkbox" id="symbols" checked>
          <span>Symbols (!@#$...)</span>
        </label>
      </div>

      <p id="errorMessage" class="error" role="alert"></p>

      <button id="generateBtn" class="generate-btn" type="button">
        Generate Password
      </button>

      <p class="tip">Tip: Use a longer password with multiple character types.</p>
    </section>

    <footer>
      <p>Veda Technology | Web Development Internship | Task 17</p>
    </footer>
  </main>
</body>
</html>
